[metadata]
name = dante-trainer
version = attr: dante.__version__
author = Giuseppe Timpano
author_email = giuseppe.timpano@unicz.it
description = DAfNe TrainEr - PyTorch-based model trainer for the Dafne segmentation framework
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/dafne-imaging/dafne-torch-trainer
project_urls =
    Bug Tracker = https://github.com/dafne-imaging/dafne-torch-trainer/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires = file: requirements.txt
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
dante = models/*

[options.entry_points]
console_scripts =
    dante = dante.ui.ModelTrainerSplit:main
    dante_train = dante.bin.train_cli:main
