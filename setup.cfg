[metadata]
name = dafne-torch-trainer
version = attr: dafne_trainer.__version__
author = Giuseppe Timpano
author_email = giuseppe.timpano@unicz.it
description = Deep Learning pytorch models module for Dafne
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/dafne-imaging/dafne-torch-trainer
project_urls =
    Bug Tracker = https://github.com/dafne-imaging/dafne-torch-trainer/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires = file: requirements.txt
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
dafne_trainer = models/*

[options.entry_points]
console_scripts =
    dafne_trainer = dafne_trainer.ui.ModelTrainerSplit:main
    dafne_train = dafne_trainer.bin.train_cli:main
